plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'   // BlockBench project files stay out of the jar
    exclude 'src/generated/**/.cache'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = 'zerog-tweaks-' + minecraft_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Local opt-in tests; never package test classes in a normal release jar.
if (providers.gradleProperty('zeroGTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
if (providers.gradleProperty('tidewraithTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/tidewraith-gametest/java'
    sourceSets.main.resources.srcDir 'src/tidewraith-gametest/resources'
}
if (providers.gradleProperty('clientReview').isPresent()) {
    sourceSets.main.java.srcDir 'src/client-review/java'
}
if (providers.gradleProperty('geneticsTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/genetics-gametest/java'
    sourceSets.main.resources.srcDir 'src/genetics-gametest/resources'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
if (providers.gradleProperty('workflowTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/workflow-gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    sourceSets.main.resources.srcDir 'src/workflow-gametest/resources'
}
if (providers.gradleProperty('planetHubTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/planet-hub-gametest/java'
    sourceSets.main.resources.srcDir 'src/planet-hub-gametest/resources'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        workflowTests {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('workflowTestDirectory').getOrElse('run-local-workflow-20261005'))
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('workflowTestNamespaces').getOrElse('zerog_tweaks')
        }
        geneticsTests {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('geneticsTestDirectory').getOrElse('run-local-genetics-20261005'))
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('geneticsTestNamespaces').getOrElse('zerog_tweaks')
        }
        zeroGTests {
            type = 'gameTestServer'
            gameDirectory = file('run-local-zerog-tests')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zerog_tweaks'
        }
        planetHubTests {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('planetTestDirectory').getOrElse('run-local-planet-generation-20261004-r2'))
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('planetTestNamespaces').getOrElse('zerog_tweaks')
            systemProperty 'zerog.cleanShowcase', providers.gradleProperty('cleanShowcase').getOrElse('false')
        }
        client {
            client()
            gameDirectory = file('run')
        }
        assetReview {
            client()
            gameDirectory = file('run-local-asset-review')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'maven.modrinth:geckolib:Grwn5rUB' // NeoForge 1.21.1, GeckoLib 4.9.3
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
